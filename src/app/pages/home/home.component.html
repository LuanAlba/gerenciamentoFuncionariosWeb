<mat-card>
    <div class="funcionario-box">
        <button mat-raised-button color="primary" routerLink="/cadastrarFuncionario">Cadastrar novo funcionário</button>
        <div class="input-box">
            <mat-form-field>
                <mat-label>Procurar:</mat-label>
                <input matInput type="text" (input)="search($event)">
            </mat-form-field>
        </div>
    </div>

    <table mat-table [dataSource]="funcionarios" class="mat-elevation-z8">
        <ng-container matColumnDef="Situação">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let funcionario">
                <div *ngIf="funcionario.ativo == true; else inativo">
                    <img src="assets/images/Ativo.png" style="height: 20px; width: 20px;">
                </div>
                <ng-template #inativo>
                    <img src="assets/images/Inativo.png" style="height: 20px; width: 20px;">
                </ng-template>
            </td>
        </ng-container>

        <ng-container matColumnDef="Nome">
            <th mat-header-cell *matHeaderCellDef> Nome </th>
            <td mat-cell *matCellDef="let funcionario"> {{funcionario.nome}} </td>
        </ng-container>

        <ng-container matColumnDef="CPF">
            <th mat-header-cell *matHeaderCellDef> CPF </th>
            <td mat-cell *matCellDef="let funcionario"> {{funcionario.cpf}} </td>
        </ng-container>

        <ng-container matColumnDef="Turno">
            <th mat-header-cell *matHeaderCellDef> Turno </th>
            <td mat-cell *matCellDef="let funcionario"> {{funcionario.turno}} </td>
        </ng-container>

        <ng-container matColumnDef="Admissao">
            <th mat-header-cell *matHeaderCellDef> Admissão </th>
            <td mat-cell *matCellDef="let funcionario"> {{funcionario.admissao}} </td>
        </ng-container>

        <ng-container matColumnDef="Ações">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let funcionario">
                <button mat-raised-button style="margin: 5px" routerLink="/detalhes/{{funcionario.id}}">Detalhes</button>
                <button mat-raised-button color="accent" style="margin: 5px" routerLink="/editarFuncionario/{{funcionario.id}}">Editar</button>
                <button mat-raised-button color="warn">Excluir</button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="colunas"></tr>
        <tr mat-row *matRowDef="let row; columns: colunas;"></tr>
    </table>
</mat-card>
