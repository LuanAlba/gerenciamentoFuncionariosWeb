<div class="funcionario-box">
    <button>Cadastrar novo funcionário</button>
    <div class="input-box">
        <label>Procurar:</label>
        <input type="text" 
               placeholder="Qual registro está buscando?"
               (input)="search($event)">
    </div>
</div>

<!-- Status, Nome, cpf, telefone, cargo, salário, data de admissão ações-->
<table class="table">
    <thead>
        <tr>
            <th>Ativo</th>
            <th>Nome</th>
            <th>CPF</th>
            <th>Admissao</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody *ngFor="let funcionario of funcionarios">
        <tr>
            <td>
                <div *ngIf="funcionario.ativo == true; else inativo">
                    <img src="assets/images/Ativo.png" style="height: 20px; width: 20px;">
                </div>
                <ng-template #inativo>
                    <img src="assets/images/Inativo.png" style="height: 20px; width: 20px;">
                </ng-template>
            </td>
            <td>{{ funcionario.nome }}</td>
            <td>{{ funcionario.cpf }}</td>
            <td>{{ funcionario.admissao }}</td>
            <td>
                <button>Editar</button>
                <button>Excluir</button>
            </td>
        </tr>
    </tbody>
</table>
